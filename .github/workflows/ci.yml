name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar servidor
        run: pnpm run check

      - name: Ejecutar pruebas versionadas
        shell: bash
        run: |
          mapfile -t tests < <(
            git ls-files 'test/*.test.js' |
              grep -Ev 'test/(control-demo-company|control-frontend)\.test\.js$'
          )
          node --test "${tests[@]}"
